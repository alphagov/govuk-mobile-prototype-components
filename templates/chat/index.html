<!doctype html>
<!--
  Template: a new chat, the root of the Chat tab, as the GOV.UK app has it.
  Where the Chat template starts: copy the folder, then change it.

  The journey: asking a question, by tapping a question to try or typing
  one and sending it, opens generating.html, which shows it being answered,
  then moves on to answer.html by itself after a few seconds.

  Change: the questions to try. Give the one your journey follows
  href="generating.html"; the others are named buttons, so go nowhere. To
  ask a different question, change it here, in generating.html and in
  answer.html, and write its answer in answer.html.

  Leave: the heading, the welcome message and its note, the field with its
  menu, and the tab bar, with Chat selected. Home and Settings open the
  Home and Settings templates, if they're beside this one.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat – GOV.UK app prototype</title>
  <script type="module" src="../../frame/frame.js"></script>
  <script type="module" src="../../components/screen/screen.js"></script>
  <script type="module" src="../../components/heading/heading.js"></script>
  <script type="module" src="../../components/text/text.js"></script>
  <script type="module" src="../../components/chat-answer/chat-answer.js"></script>
  <script type="module" src="../../components/chat-example-questions/chat-example-questions.js"></script>
  <script type="module" src="../../components/chat-input/chat-input.js"></script>
  <script type="module" src="../../components/menu-button/menu-button.js"></script>
  <script type="module" src="../../components/tab-bar/tab-bar.js"></script>
</head>
<body>
  <govuk-prototype-frame>
    <govuk-app highlight-actions>
      <govuk-app-screen background="chat">
        <govuk-app-heading level="1" size="title-2" align="center">GOV.UK Chat</govuk-app-heading>

        <govuk-app-chat-answer note="Messages will be saved for 90 days.">
          <govuk-app-text>Hi, I’m GOV.UK Chat 👋. I use AI to help you find what you need on GOV.UK.</govuk-app-text>
        </govuk-app-chat-answer>

        <govuk-app-chat-example-questions>
          <govuk-app-chat-example-question href="generating.html">How do I renew my passport?</govuk-app-chat-example-question>
          <govuk-app-chat-example-question name="caring">What benefits can I get if I’m caring for someone?</govuk-app-chat-example-question>
          <govuk-app-chat-example-question name="council-tax">When is my council tax due?</govuk-app-chat-example-question>
        </govuk-app-chat-example-questions>

        <govuk-app-chat-input slot="footer" action="generating.html">
          <govuk-app-menu-button-item name="privacy">Privacy notice</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="about">About</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="feedback">Give feedback</govuk-app-menu-button-item>
        </govuk-app-chat-input>

        <govuk-app-tab-bar>
          <govuk-app-tab-bar-item icon="home" href="../home/index.html">Home</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="chat_bubble" href="index.html" selected>Chat</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="settings" href="../settings/index.html">Settings</govuk-app-tab-bar-item>
        </govuk-app-tab-bar>
      </govuk-app-screen>
    </govuk-app>
  </govuk-prototype-frame>
</body>
</html>
