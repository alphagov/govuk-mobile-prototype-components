<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Licence – GOV.UK app example</title>
  <link rel="stylesheet" href="../example.css">
  <script type="module" src="../../src/frame/frame.js"></script>
  <script type="module" src="../example.js"></script>
  <script type="module" src="../../src/components/screen/screen.js"></script>
  <script type="module" src="../../src/components/nav-bar/nav-bar.js"></script>
  <script type="module" src="../../src/components/segmented-control/segmented-control.js"></script>
  <script type="module" src="../../src/components/grouped-list/grouped-list.js"></script>
  <script type="module" src="../../src/components/card-header/card-header.js"></script>
  <script type="module" src="../../src/components/heading/heading.js"></script>
  <script type="module" src="../../src/components/text/text.js"></script>
  <script type="module" src="../../src/components/address/address.js"></script>
  <script type="module" src="../../src/components/status/status.js"></script>
  <script type="module" src="../../src/components/button/button.js"></script>
  <script type="module" src="../../src/components/summary-columns/summary-columns.js"></script>
  <script type="module" src="../../src/components/count/count.js"></script>
  <script type="module" src="../../src/components/stack/stack.js"></script>
  <script type="module" src="../../src/components/menu-button/menu-button.js"></script>
  <script type="module" src="../../src/components/section/section.js"></script>
  <script type="module" src="../../src/components/tab-bar/tab-bar.js"></script>
</head>
<body>
  <govuk-prototype-frame>
    <a class="example-back" href="../">Back to examples</a>
    <govuk-app highlight-actions>
      <govuk-app-screen>
        <govuk-app-nav-bar title="Driving" large-title back-href="../home/index.html"></govuk-app-nav-bar>

        <govuk-app-segmented-control label="Driving">
          <govuk-app-segmented-control-item href="index.html">Vehicles</govuk-app-segmented-control-item>
          <govuk-app-segmented-control-item href="licence.html" selected>Licence</govuk-app-segmented-control-item>
        </govuk-app-segmented-control>

        <govuk-app-grouped-list dividers="full">
          <govuk-app-grouped-list-row type="content">
            <govuk-app-stack direction="horizontal" distribute="between">
              <govuk-app-text size="subheadline" colour="secondary">Full licence</govuk-app-text>
              <govuk-app-menu-button name="licence-menu">
                <govuk-app-menu-button-item href="https://www.gov.uk/change-address-driving-licence">Change address</govuk-app-menu-button-item>
                <govuk-app-menu-button-item href="https://www.gov.uk/replacement-driving-licence">Replace licence</govuk-app-menu-button-item>
              </govuk-app-menu-button>
            </govuk-app-stack>
            <govuk-app-heading level="2" size="title-1">ARENO803236AA170</govuk-app-heading>
          </govuk-app-grouped-list-row>
          <govuk-app-grouped-list-row type="content">
            <govuk-app-address name="Ms Anna Ornella Arenö">
              29 Orchard Drive
              Milton Keynes
              PA98 J83
            </govuk-app-address>
          </govuk-app-grouped-list-row>
          <govuk-app-grouped-list-row type="content">
            <govuk-app-status state="due" progress="0.75" label="Expiring" detail="24 April 2026" caption="59 days"></govuk-app-status>
            <govuk-app-button name="renew-licence">Renew licence</govuk-app-button>
            <govuk-app-text size="subheadline" colour="secondary" align="center">Your licence status may not update immediately when you renew it</govuk-app-text>
          </govuk-app-grouped-list-row>
        </govuk-app-grouped-list>

        <govuk-app-section title="Driver record" description="There are no offences on your record.">
          <govuk-app-grouped-list>
          <govuk-app-grouped-list-row type="content" flush>
            <govuk-app-summary-columns>
              <govuk-app-summary-column>
                <govuk-app-count value="0">Offences</govuk-app-count>
              </govuk-app-summary-column>
              <govuk-app-summary-column>
                <govuk-app-count value="0">Points</govuk-app-count>
              </govuk-app-summary-column>
            </govuk-app-summary-columns>
          </govuk-app-grouped-list-row>
          <govuk-app-grouped-list-row name="driver-record-history">History</govuk-app-grouped-list-row>
          </govuk-app-grouped-list>
        </govuk-app-section>

        <govuk-app-tab-bar>
          <govuk-app-tab-bar-item icon="home" href="../home/index.html" selected>Home</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="chat_bubble" href="../chat/index.html">Chat</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="settings" href="../settings/index.html">Settings</govuk-app-tab-bar-item>
        </govuk-app-tab-bar>
      </govuk-app-screen>
    </govuk-app>
  </govuk-prototype-frame>
</body>
</html>
