<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Licence expired – GOV.UK app example</title>
  <link rel="stylesheet" href="../example.css">
  <script type="module" src="../example.js"></script>
  <script type="module" src="../../components/screen/screen.js"></script>
  <script type="module" src="../../components/nav-bar/nav-bar.js"></script>
  <script type="module" src="../../components/segmented-control/segmented-control.js"></script>
  <script type="module" src="../../components/grouped-list/grouped-list.js"></script>
  <script type="module" src="../../components/card-header/card-header.js"></script>
  <script type="module" src="../../components/heading/heading.js"></script>
  <script type="module" src="../../components/text/text.js"></script>
  <script type="module" src="../../components/address/address.js"></script>
  <script type="module" src="../../components/status/status.js"></script>
  <script type="module" src="../../components/button/button.js"></script>
  <script type="module" src="../../components/summary-columns/summary-columns.js"></script>
  <script type="module" src="../../components/count/count.js"></script>
  <script type="module" src="../../components/stack/stack.js"></script>
  <script type="module" src="../../components/menu-button/menu-button.js"></script>
  <script type="module" src="../../components/section/section.js"></script>
  <script type="module" src="../../components/tab-bar/tab-bar.js"></script>
</head>
<body>
  <div class="example-phone">
    <govuk-app>
      <govuk-app-screen>
        <govuk-app-nav-bar title="Driving" large-title back-href="../home/index.html"></govuk-app-nav-bar>

        <govuk-app-segmented-control label="Driving">
          <govuk-app-segmented-control-item href="index.html">Vehicles</govuk-app-segmented-control-item>
          <govuk-app-segmented-control-item href="licence.html" selected>Licence</govuk-app-segmented-control-item>
        </govuk-app-segmented-control>

        <govuk-app-grouped-list dividers="full">
          <govuk-app-grouped-list-row type="content" flush>
            <govuk-app-card-header>
              <govuk-app-stack direction="horizontal" distribute="between">
                <govuk-app-text size="subheadline" emphasis>Expired 28 March 2026</govuk-app-text>
                <govuk-app-menu-button name="licence-menu">
                <govuk-app-menu-button-item href="https://www.gov.uk/change-address-driving-licence">Change address</govuk-app-menu-button-item>
                <govuk-app-menu-button-item href="https://www.gov.uk/replacement-driving-licence">Replace licence</govuk-app-menu-button-item>
              </govuk-app-menu-button>
              </govuk-app-stack>
              <govuk-app-heading level="2" size="title-1">ARENO803236AA170</govuk-app-heading>
            </govuk-app-card-header>
          </govuk-app-grouped-list-row>
          <govuk-app-grouped-list-row type="content">
            <govuk-app-address name="Ms Anna Ornella Arenö">
              29 Orchard Drive
              Milton Keynes
              PA98 J83
            </govuk-app-address>
          </govuk-app-grouped-list-row>
          <govuk-app-grouped-list-row type="content">
            <govuk-app-button name="renew-licence">Renew licence</govuk-app-button>
            <govuk-app-text size="subheadline" colour="secondary" align="center">You must renew your licence before you can legally drive. Your status may not update immediately after renewal.</govuk-app-text>
          </govuk-app-grouped-list-row>
        </govuk-app-grouped-list>

        <govuk-app-section title="Driver record" description="There are no offences on your record.">
          <govuk-app-grouped-list>
          <govuk-app-grouped-list-row type="content" flush>
            <govuk-app-summary-columns>
              <govuk-app-summary-column>
                <govuk-app-count value="0">Offences</govuk-app-count>
              </govuk-app-summary-column>
              <govuk-app-summary-column>
                <govuk-app-count value="0">Points</govuk-app-count>
              </govuk-app-summary-column>
            </govuk-app-summary-columns>
          </govuk-app-grouped-list-row>
          <govuk-app-grouped-list-row name="driver-record-history">History</govuk-app-grouped-list-row>
          </govuk-app-grouped-list>
        </govuk-app-section>

        <govuk-app-tab-bar>
          <govuk-app-tab-bar-item icon="home" href="../home/index.html" selected>Home</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="chat_bubble" name="chat">Chat</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="settings" href="../settings/index.html">Settings</govuk-app-tab-bar-item>
        </govuk-app-tab-bar>
      </govuk-app-screen>
    </govuk-app>
  </div>
</body>
</html>
