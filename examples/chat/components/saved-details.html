<!-- Proposed: the details the app has saved, on a card, for the user to
     choose which to use, and a button to carry on with those they chose. A
     form, so the page can read which were chosen when it is submitted. -->
<template>
  <form class="govuk-app-chat-saved-details" data-attr="name: name">
    <div class="govuk-app-chat-saved-details__rows" data-slot="content"></div>
    <button class="govuk-app-chat-saved-details__submit" type="submit" data-text="action"></button>
  </form>
</template>
