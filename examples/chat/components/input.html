<!-- Where the user types their question, with the send button in its corner:
     ChatActionView's text editor and send button. A form, so pressing send,
     or return, submits it, for the page to answer. -->
<template>
  <form class="govuk-app-chat-input">
    <div class="govuk-app-chat-input__box">
      <input class="govuk-app-chat-input__field" type="text" name="question" autocomplete="off" aria-label="Message" data-attr="placeholder: placeholder, value: value">
      <button class="govuk-app-chat-input__send" type="submit" aria-label="Send">
        <span class="govuk-app-chat-input__icon govuk-app-icon" aria-hidden="true">arrow_upward</span>
      </button>
    </div>
  </form>
</template>
