<!-- GOV.UK Chat's answer, on a card: ChatCellView's answer and intro. While
     it is pending, three dots take its place, as ChatCellView's pendingAnswer
     animation does, and what was written between its tags shows once it
     isn't. -->
<template>
  <div class="govuk-app-chat-answer" role="status" aria-label="Generating your answer" data-if="pending" data-attr="data-pending: pending">
    <span class="govuk-app-chat-answer__dot"></span>
    <span class="govuk-app-chat-answer__dot"></span>
    <span class="govuk-app-chat-answer__dot"></span>
  </div>
  <div class="govuk-app-chat-answer" data-if="ready" data-slot="content"></div>
</template>
