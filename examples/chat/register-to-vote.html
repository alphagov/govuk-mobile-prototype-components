<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remembering what you tell it – Chat – GOV.UK app example</title>
  <link rel="stylesheet" href="../example.css">
  <script type="module" src="../example.js"></script>
  <script type="module" src="../../components/screen/screen.js"></script>
  <script type="module" src="../../components/heading/heading.js"></script>
  <script type="module" src="../../components/tab-bar/tab-bar.js"></script>
  <script type="module">
    // Proposed, from a researcher's mockup: how does it feel when the app
    // remembers something from a chat, to use again? Chat asks for an
    // address, and whatever is typed is what the app picks up.
    //
    // Coming back from the info the app has picked up (#saved), the
    // conversation is as it was left, without waiting for Chat.
    import { ask, reply, onQuestion } from './proposals/chat.js'

    const key = 'govuk-app-chat-example-address'
    const fallback = '6 Market Street, Saxford, SX1 1CD'
    const remembered = () => { try { return sessionStorage.getItem(key) } catch { return null } }

    /** The address, then what the app picked up from it, then the answer. */
    async function answer(address, options) {
      ask(address)
      const note = document.querySelector('#remembered').content.cloneNode(true)
      note.querySelector('[data-address]').textContent = address
      await reply([note.firstElementChild, document.querySelector('#answer')], options)
    }

    let asked = false
    onQuestion(async question => {
      if (asked) {
        ask(question)
        return reply(['This is a prototype, so I can only answer the questions it was written for.'])
      }
      asked = true
      try { sessionStorage.setItem(key, question) } catch {}
      await answer(question)
    })

    if (location.hash === '#saved') {
      asked = true
      await answer(remembered() ?? fallback, { instantly: true })
    }
  </script>
</head>
<body>
  <div class="example-phone">
    <govuk-app highlight-actions>
      <govuk-app-screen background="chat">
        <govuk-app-heading level="1" size="title-2" align="center">GOV.UK Chat</govuk-app-heading>

        <govuk-app-chat-answer note="Messages will be saved for 90 days.">
          <govuk-app-text>Hi, I’m GOV.UK Chat 👋. I use AI to help you find what you need on GOV.UK.</govuk-app-text>
        </govuk-app-chat-answer>

        <govuk-app-chat-question>I just moved house and want to register to vote</govuk-app-chat-question>
        <govuk-app-chat-answer>
          <govuk-app-text>What’s your address?</govuk-app-text>
        </govuk-app-chat-answer>

        <!-- What Chat shows once it has the address. -->
        <template id="remembered">
          <govuk-app-chat-remembered href="info-from-chats.html">You live at <span data-address></span></govuk-app-chat-remembered>
        </template>
        <template id="answer">
          <govuk-app-chat-answer>
            <govuk-app-text>You can register to vote online. It takes about 5 minutes.</govuk-app-text>
            <govuk-app-text>You’ll need your National Insurance number. You’ll be asked for your new address, and the address you lived at before you moved.</govuk-app-text>
          </govuk-app-chat-answer>
        </template>

        <govuk-app-chat-input slot="footer">
          <govuk-app-menu-button-item href="index.html" destructive icon="delete">Clear chat</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="privacy">Privacy notice</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="about">About</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="feedback">Give feedback</govuk-app-menu-button-item>
        </govuk-app-chat-input>

        <govuk-app-tab-bar>
          <govuk-app-tab-bar-item icon="home" href="../home/index.html">Home</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="chat_bubble" href="index.html" selected>Chat</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="settings" href="../settings/index.html">Settings</govuk-app-tab-bar-item>
        </govuk-app-tab-bar>
      </govuk-app-screen>
    </govuk-app>
  </div>
</body>
</html>
