<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat – GOV.UK app example</title>
  <link rel="stylesheet" href="../example.css">
  <script type="module" src="../example.js"></script>
  <script type="module" src="../../components/screen/screen.js"></script>
  <script type="module" src="../../components/nav-bar/nav-bar.js"></script>
  <script type="module" src="../../components/text/text.js"></script>
  <script type="module" src="components/chat.js"></script>
</head>
<body>
  <div class="example-phone">
    <govuk-app highlight-actions>
      <govuk-app-screen>
        <govuk-app-nav-bar title="GOV.UK Chat"></govuk-app-nav-bar>

        <govuk-app-chat-conversation>
          <govuk-app-chat-answer>
            <govuk-app-text>Hi, I’m GOV.UK Chat 👋. I use AI to help you find what you need on GOV.UK.</govuk-app-text>
            <govuk-app-text size="footnote" colour="secondary">Messages will be saved for 90 days.</govuk-app-text>
          </govuk-app-chat-answer>

          <!-- Each opens a conversation from the researcher's mockups. -->
          <govuk-app-chat-suggestions>
            <govuk-app-chat-suggestion href="universal-credit.html">How will breaking up with my partner change my Universal Credit?</govuk-app-chat-suggestion>
            <govuk-app-chat-suggestion href="register-to-vote.html">I just moved house and want to register to vote</govuk-app-chat-suggestion>
          </govuk-app-chat-suggestions>
        </govuk-app-chat-conversation>

        <govuk-app-chat-input slot="footer" placeholder="Ask a question..."></govuk-app-chat-input>
      </govuk-app-screen>
    </govuk-app>
  </div>
</body>
</html>
