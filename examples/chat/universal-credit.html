<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Using saved info – Chat – GOV.UK app example</title>
  <link rel="stylesheet" href="../example.css">
  <script type="module" src="../example.js"></script>
  <script type="module" src="../../components/screen/screen.js"></script>
  <script type="module" src="../../components/heading/heading.js"></script>
  <script type="module" src="../../components/tab-bar/tab-bar.js"></script>
  <script type="module">
    // Proposed, from a researcher's mockup: which saved details would someone
    // let Chat use, and what would they need to know to decide? Chat asks
    // once the page has loaded, and answers with what they chose.
    import { ask, reply } from './proposals/chat.js'

    await reply([
      'I can calculate the amount you’re entitled to.',
      'Can I use the info you’ve previously saved in the app?',
      document.querySelector('#saved-details'),
    ])

    /** "a, b and c" */
    const list = items => items.length < 2 ? items.join('') : `${items.slice(0, -1).join(', ')} and ${items.at(-1)}`

    document.addEventListener('submit', async event => {
      const form = event.target.closest('.govuk-app-chat-saved-details')
      if (!form) return
      event.preventDefault()
      form.inert = true
      const used = new FormData(form).getAll('use')
      if (used.length) {
        ask(`Use my ${list(used)}`)
        await reply([`Thanks. I’ll use your ${list(used)} to work out how your Universal Credit could change once your partner moves out.`, 'When do you think they’ll move out? If you’re not sure yet, tell me roughly when.'])
      } else {
        ask('Don’t use my saved info')
        await reply(['That’s fine. I’ll ask you for what I need as we go.', 'First, how much do you earn a year, before tax?'])
      }
    })
  </script>
</head>
<body>
  <div class="example-phone">
    <govuk-app highlight-actions>
      <govuk-app-screen background="chat">
        <govuk-app-heading level="1" size="title-2" align="center">GOV.UK Chat</govuk-app-heading>

        <govuk-app-chat-answer note="Messages will be saved for 90 days.">
          <govuk-app-text>Hi, I’m GOV.UK Chat 👋. I use AI to help you find what you need on GOV.UK.</govuk-app-text>
        </govuk-app-chat-answer>

        <govuk-app-chat-question>I broke up with my partner who will be moving out but not sure when yet</govuk-app-chat-question>
        <govuk-app-chat-question>How will this change my Universal Credit?</govuk-app-chat-question>

        <!-- What Chat shows once it has answered. Each detail's name is what
             the reply calls it. -->
        <template id="saved-details">
          <govuk-app-chat-saved-details action="Continue">
            <govuk-app-chat-saved-detail label="Name" name="name" source="From your GOV.UK One Login">Priya Shah</govuk-app-chat-saved-detail>
            <govuk-app-chat-saved-detail label="Date of birth" name="date of birth" source="From your GOV.UK One Login">8 March 1993</govuk-app-chat-saved-detail>
            <govuk-app-chat-saved-detail label="Your income" name="income" source="You told Chat on 2 October 2026">£6,238 per year</govuk-app-chat-saved-detail>
            <govuk-app-chat-saved-detail label="Monthly rent" name="monthly rent" source="You told Chat on 2 October 2026">£730</govuk-app-chat-saved-detail>
            <govuk-app-chat-saved-detail label="You have a disability and get" name="disability benefit" source="You told Chat on 14 August 2026">£76.70 per week</govuk-app-chat-saved-detail>
          </govuk-app-chat-saved-details>
        </template>

        <govuk-app-chat-input slot="footer">
          <govuk-app-menu-button-item href="index.html" destructive icon="delete">Clear chat</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="privacy">Privacy notice</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="about">About</govuk-app-menu-button-item>
          <govuk-app-menu-button-item name="feedback">Give feedback</govuk-app-menu-button-item>
        </govuk-app-chat-input>

        <govuk-app-tab-bar>
          <govuk-app-tab-bar-item icon="home" href="../home/index.html">Home</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="chat_bubble" href="index.html" selected>Chat</govuk-app-tab-bar-item>
          <govuk-app-tab-bar-item icon="settings" href="../settings/index.html">Settings</govuk-app-tab-bar-item>
        </govuk-app-tab-bar>
      </govuk-app-screen>
    </govuk-app>
  </div>
</body>
</html>
