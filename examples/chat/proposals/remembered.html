<!-- Proposed: a note that the app has picked something up from the chat and
     will remember it, with what it picked up, and a link to all it has. -->
<template>
  <div class="govuk-app-chat-remembered" role="note">
    <p class="govuk-app-chat-remembered__title govuk-app-text">The app will use this information to personalise your experience from now on.</p>
    <p class="govuk-app-chat-remembered__fact govuk-app-text" data-slot="content"></p>
    <a class="govuk-app-chat-remembered__link govuk-app-text" data-attr="href: href">See all info picked up from chats</a>
  </div>
</template>
