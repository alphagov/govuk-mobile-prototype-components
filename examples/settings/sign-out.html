<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign out – GOV.UK app example</title>
  <link rel="stylesheet" href="../example.css">
  <script type="module" src="../example.js"></script>
  <script type="module" src="../../components/screen/screen.js"></script>
  <script type="module" src="../../components/heading/heading.js"></script>
  <script type="module" src="../../components/text/text.js"></script>
  <script type="module" src="../../components/button/button.js"></script>
  <script type="module" src="../../components/button-stack/button-stack.js"></script>
  <script type="module">
    // Buttons go nowhere of their own: the page listens for which was
    // pressed, by its name, and goes where the app would.
    const next = { 'sign-out': 'signed-out.html', cancel: 'index.html' }
    document.addEventListener('click', event => {
      const button = event.target.closest('govuk-app button')
      if (next[button?.name]) location.href = next[button.name]
    })
  </script>
</head>
<body>
  <div class="example-phone">
    <govuk-app>
      <govuk-app-screen background="modal">
        <govuk-app-heading level="1" size="title-1">Are you sure you want to sign out?</govuk-app-heading>
        <govuk-app-text>If you’re using Face ID or Touch ID to unlock the app, this will be turned off. You can turn it on again the next time you sign in.</govuk-app-text>
        <govuk-app-button-stack slot="footer">
          <govuk-app-button variant="destructive" name="sign-out">Sign out</govuk-app-button>
          <govuk-app-button variant="grouped-secondary" name="cancel">Cancel</govuk-app-button>
        </govuk-app-button-stack>
      </govuk-app-screen>
    </govuk-app>
  </div>
</body>
</html>
