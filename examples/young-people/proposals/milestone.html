<!-- Proposed: where the user is in growing up, on a card at the top of Home:
     their age in a badge, a heading, and what was written between its tags
     below it. -->
<template>
  <div class="govuk-app-milestone">
    <span class="govuk-app-milestone__age" aria-hidden="true" data-text="age"></span>
    <div class="govuk-app-milestone__text">
      <h2 class="govuk-app-milestone__title govuk-app-text" data-text="title"></h2>
      <p class="govuk-app-milestone__description govuk-app-text" data-slot="content"></p>
    </div>
  </div>
</template>
