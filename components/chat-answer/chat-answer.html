<!-- An answer from GOV.UK Chat: what was written between its tags, on a
     white card, and below it, if it has any <govuk-app-chat-source>
     elements, the warning that answers can be wrong and the GOV.UK pages it
     used, in a list that opens and closes. chat-answer.js sorts the sources
     from the rest. -->
<template>
  <article class="govuk-app-chat-answer" aria-label="GOV.UK Chat">
    <div class="govuk-app-chat-answer__content" data-slot="body"></div>
    <p class="govuk-app-chat-answer__note" data-if="note" data-text="note"></p>
    <div class="govuk-app-chat-answer__sources" data-if="sources">
      <p class="govuk-app-chat-answer__warning"><span class="govuk-app-icon govuk-app-chat-answer__warning-icon" aria-hidden="true">error</span><span>GOV.UK Chat can make mistakes. Check GOV.UK pages for important information.</span></p>
      <details class="govuk-app-chat-answer__details" data-attr="open: sourcesOpen">
        <summary class="govuk-app-chat-answer__summary">GOV.UK pages used in this answer<span class="govuk-app-icon govuk-app-chat-answer__chevron" aria-hidden="true">expand_more</span></summary>
        <ul class="govuk-app-chat-answer__list" data-slot="sources"></ul>
      </details>
    </div>
  </article>
</template>
