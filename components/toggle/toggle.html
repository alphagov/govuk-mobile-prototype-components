<!-- A switch: a checkbox, drawn as iOS's, on if it is checked. Its name for
     screen readers is its label, or the <label> it is in, as in a grouped
     list's toggle row. -->
<template>
  <input class="govuk-app-toggle" type="checkbox" role="switch" data-attr="name: name, value: value, checked: checked, aria-label: label">
</template>
