<!-- One action in a <govuk-app-nav-bar>. With an icon, a Material Symbol
     named by the icon attribute, it draws only the icon, and what is written
     between the tags is its name for screen readers. Without one, it draws
     that text. A link to another page if it has an href, otherwise a button. -->
<template>
  <a class="govuk-app-nav-bar-item" data-if="href" data-attr="href: href, data-icon: hasIcon">
    <span class="govuk-app-nav-bar-item__icon govuk-app-icon" aria-hidden="true" data-if="icon" data-text="icon"></span>
    <span class="govuk-app-nav-bar-item__label" data-attr="data-hidden: hasIcon" data-slot="content"></span>
  </a>
  <button class="govuk-app-nav-bar-item" type="button" data-if="button" data-attr="name: name, value: value, data-icon: hasIcon">
    <span class="govuk-app-nav-bar-item__icon govuk-app-icon" aria-hidden="true" data-if="icon" data-text="icon"></span>
    <span class="govuk-app-nav-bar-item__label" data-attr="data-hidden: hasIcon" data-slot="content"></span>
  </button>
</template>
