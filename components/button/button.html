<!-- A GOV.UK app button. Its label is whatever is written between the
     <govuk-app-button> tags. Its name and value, if given, tell one click
     from another. A submit button sends the form it's in. -->
<template>
  <button class="govuk-app-button"
          data-attr="type: type, data-variant: variant, disabled: disabled, name: name, value: value"
          data-slot="content"></button>
</template>
