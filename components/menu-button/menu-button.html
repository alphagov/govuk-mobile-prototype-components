<!-- A round "…" button that opens a menu of the
     <govuk-app-menu-button-item> elements written between its tags. -->
<template>
  <span class="govuk-app-menu-button">
    <button class="govuk-app-menu-button__button" type="button" aria-haspopup="menu" data-attr="aria-label: label, popovertarget: id, name: name"></button>
    <div class="govuk-app-menu-button__menu" popover role="menu" data-attr="id: id, aria-label: label" data-slot="content"></div>
  </span>
</template>
