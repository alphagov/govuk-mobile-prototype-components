<!-- An icon, a Material Symbol named by its icon attribute, with a short
     label, what was written between its tags: over it, or beside it. -->
<template>
  <span class="govuk-app-labelled-icon" data-attr="data-layout: layout, aria-label: label, role: role">
    <span class="govuk-app-labelled-icon__icon govuk-app-icon" aria-hidden="true" data-text="icon"></span>
    <span class="govuk-app-labelled-icon__label govuk-app-text" data-slot="content"></span>
  </span>
</template>
