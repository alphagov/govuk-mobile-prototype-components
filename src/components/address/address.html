<!-- An address: a name, if it has one, in bold, over the lines of the
     address, what was written between its tags, a line each. -->
<template>
  <div class="govuk-app-address">
    <p class="govuk-app-address__name govuk-app-text" data-if="name" data-text="name"></p>
    <p class="govuk-app-address__lines govuk-app-text" data-if="lines" data-text="lines"></p>
  </div>
</template>
