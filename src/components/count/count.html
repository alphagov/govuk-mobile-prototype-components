<!-- A count: its value, big, over what it counts, what was written between
     its tags, such as 0 over Offences. -->
<template>
  <span class="govuk-app-count">
    <span class="govuk-app-count__value govuk-app-text" data-text="value"></span>
    <span class="govuk-app-count__label govuk-app-text" data-slot="content"></span>
  </span>
</template>
